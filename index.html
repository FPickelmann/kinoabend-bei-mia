.hotspot{position:absolute;transform:translateX(-50%);top:27%;height:31%;width:19%;display:flex;align-items:end;justify-content:center;padding:0;background:transparent;border-radius:12px;touch-action:manipulation}
.hotspot:hover,.hotspot:focus-visible{background:#ffebae26;outline:2px solid #fff1bc}
.hotspot span{background:#fff8e9;color:#26243a;padding:.28rem .52rem;border-radius:8px;box-shadow:0 2px 6px #25190580;font-size:clamp(.6rem,1.45vw,1rem)}
.hotspot .done{color:#176341}
@media(max-width:520px){.scene{border-radius:12px}.hotspot span{font-size:.62rem;padding:.21rem .25rem}.hotspot{width:23%;height:34%}}
@media print{.scene{display:none!important}}

#work{border:0;padding:0;border-radius:22px;background:#f2f2f7;color:#1c1c1e;width:min(1180px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:hidden;box-shadow:0 26px 75px #0004}
#work::backdrop{background:#0005;backdrop-filter:blur(3px)}
.station-shell{display:grid;grid-template-rows:auto minmax(0,1fr);height:min(780px,calc(100dvh - 24px))}
#tasknav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;gap:8px;background:#f9f9fb;border-bottom:1px solid #d9d9de;color:#1c1c1e}
#tasknav strong{font-size:1rem;text-align:center}
#tasknav button{background:transparent;color:#0065cf;padding:0 10px;min-height:38px;border-radius:99px}
#tasknav .tools{gap:4px}
#tasknav .tools button{width:38px;background:#e8e8ed;font-size:1.4rem;padding:0;line-height:1}
#tasknav #back{justify-self:end}
#taskbody{min-height:0;overflow:hidden}
#taskbody .layout{height:100%;grid-template-columns:minmax(0,1fr) 410px;gap:0;align-items:stretch}
#taskbody .graphic{position:static;overflow:auto;min-width:0;padding:20px;background:#e9eaee}
#taskbody figure{padding:14px;border-radius:5px;box-shadow:0 12px 25px #0001,0 1px 5px #0002}
#taskbody figure h2{font-size:clamp(1.15rem,2.3vw,1.55rem)}
#taskbody .questions{min-width:0;overflow:auto;padding:6px 16px 20px;border-left:1px solid #d9d9de}
#taskbody .card{box-shadow:none;background:transparent;border-radius:0;padding:0;margin:0 0 4px}
#taskbody .card h3{font-size:.94rem;margin:0;padding:17px 4px 8px;color:#3a3a44}
#taskbody .card fieldset{border-radius:13px;background:#fff;min-width:0;margin:0;padding:8px}
#taskbody .card legend{float:left;width:100%;padding:5px 6px;font-size:.93rem}
#taskbody .card legend + *{clear:both}
#taskbody .choices{display:grid;grid-template-columns:1fr 1fr;margin:0;gap:7px}
#taskbody .choices button{border-radius:9px;background:#eeeef3;color:#24242c;font-size:.93rem;font-weight:500;padding:8px;min-height:44px}
#taskbody .choices button:last-child:nth-child(odd){grid-column:1 / -1}
#taskbody .choices button[aria-pressed=true]{background:#d7e6ff;color:#12365c}
#taskbody .choices button.ok{background:#248054;color:#fff}
#taskbody .status{font-size:.85rem;min-height:0;margin:.35rem 0 0}
#taskbody .status:empty{display:none}
#taskbody .statements{background:#fff;border-radius:13px;padding:0 10px}
#taskbody .statement{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 10px;padding:11px 4px;font-size:.93rem}
#taskbody .statement+.statement{border-top:1px solid #e4e4e9}
#taskbody .statement .choices{display:flex;background:#e8e8ed;border-radius:9px;padding:2px;gap:2px}
#taskbody .statement .choices button{background:transparent;min-height:32px;min-width:46px;padding:4px 7px}
#taskbody .statement .choices button.ok{background:#248054;color:#fff}
#taskbody .statement .status{grid-column:1/-1}
#taskbody #reset{margin-top:12px}
@media(max-width:859px){#taskbody{overflow:auto}#taskbody .layout{display:block;height:auto}#taskbody .graphic,#taskbody .questions{overflow:visible}#taskbody .graphic{padding:12px}#taskbody .questions{border-left:0}}

const text=(x,y,t,attrs='')=>'<text x="'+x+'" y="'+y+'" '+attrs+'>'+t+'</text>';
const num=n=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:1}).format(n);
const axis='stroke="#64748b" stroke-width="1.5"';
function figure(i){
 const {title,year,unit,labels,values}=stations[i];
 let drawing='';
 if(i===0) values.forEach((v,k)=>{
  const y=32+k*46;
  drawing+=text(10,y+21,labels[k],'font-size="14"')+'<rect x="190" y="'+y+'" width="'+v*94+'" height="28" rx="4" fill="'+palette[k]+'"/>'+text(199+v*94,y+20,num(v));
 });
 if(i===1||i===3){
  const xs=i===1?[125,280,435]:[75,412.5,450];
  const max=i===1?1.6:20, scale=v=>246-v*205/max;
  const ticks=i===1?[0,.4,.8,1.2,1.6]:[0,5,10,15,20];
  ticks.forEach(v=>{const y=scale(v);drawing+='<path d="M58 '+y+'H493" stroke="#d5ddeb"/>'+text(48,y+5,num(v),'text-anchor="end" font-size="13"');});
  drawing+='<path d="M58 39V246H493" fill="none" '+axis+'/>';
  if(i===3) drawing+='<path d="M75 '+scale(values[0])+'L412.5 '+scale(values[1])+'" stroke="#235ac5" stroke-width="3" stroke-dasharray="7 5"/><path d="M412.5 '+scale(values[1])+'H450" stroke="#235ac5" stroke-width="3"/>';
  values.forEach((v,k)=>{
   const x=xs[k],y=scale(v);
   drawing+=i===1?'<rect x="'+(x-39)+'" y="'+y+'" width="78" height="'+(246-y)+'" rx="4" fill="'+palette[k]+'"/>':'<circle cx="'+x+'" cy="'+y+'" r="5" fill="#235ac5"/>';
   drawing+=text(x,y-(i===3&&k===1?19:9),num(v),'text-anchor="middle"')+text(x,269,labels[k],'text-anchor="middle" font-size="13"');
  });
 }
 if(i===2){
  let angle=-Math.PI/2;
  values.forEach((v,k)=>{
   const stop=angle+2*Math.PI*v/22.8;
   const point=a=>[143+102*Math.cos(a),139+102*Math.sin(a)].join(' ');
   const y=55+k*31;
   drawing+='<path d="M143 139 L'+point(angle)+' A102 102 0 '+(v>11.4?1:0)+' 1 '+point(stop)+'Z" fill="'+palette[k]+'" stroke="white" stroke-width="1.5"/><rect x="264" y="'+(y-12)+'" width="12" height="12" fill="'+palette[k]+'"/>'+text(283,y,labels[k],'font-size="13"')+text(550,y,num(v),'text-anchor="end"');
   angle=stop;
  });
  drawing+=text(143,268,'Insgesamt 22,8 Mrd. €','text-anchor="middle"');
 }
 return '<figure><h2>'+title+'</h2><p><small>6- bis 19-Jährige in Deutschland · '+year+' · '+unit+'</small></p><svg viewBox="0 0 565 285" role="img" aria-label="'+labels.map((l,k)=>l+': '+num(values[k])+' '+unit).join('; ')+'">'+drawing+'</svg><figcaption>'+ (i===0?'Ausgewählte Ausgabeposten. ':i===3?'Gestrichelt: Zwischen 2015 und 2024 sind keine Werte angegeben. ':'')+'Eigene Darstellung nach Globus, „Konsumfreudige Jugend“ ('+year+'). Daten: iconkids &amp; youth.</figcaption></figure>';
}

 current=null;
 nav.innerHTML='<strong>BwR 7b · Infografiken</strong><span>'+count()+' von 4 Stationen bearbeitet</span>';
 app.innerHTML='<h1>Kinoabend bei Mia</h1><p>Tippe auf einen Gegenstand. Lies die Grafik und prüfe deine Antworten.</p><div class="tools"><label><input type="checkbox" id="hide" '+(hideDone?'checked':'')+'> Fertige zur Seite legen</label></div><div class="scene" role="group" aria-label="Wohnzimmer von Mia mit vier Gegenständen auf dem Tisch">'+stations.map((obj,i)=>hideDone&&done(i)?'':'<button class="hotspot" style="left:'+ [26.3,42,57.4,75.2][i] +'%" data-open="'+i+'"><span '+(done(i)?'class="done"':'')+'>'+obj.object+(done(i)?' ✓':'')+'</span></button>').join('')+'</div><div class="tools"><button id="print">Grafiken drucken</button><button id="teacher">Für Lehrkräfte</button></div>';
 document.querySelector('#hide').onchange=e=>{hideDone=e.target.checked;home()};
 app.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>{station(+button.dataset.open);scrollTo(0,0)});
 document.querySelector('#print').onclick=()=>{app.innerHTML=stations.map((_,i)=>figure(i)).join('');window.print();home()};
 document.querySelector('#teacher').onclick=()=>{zoom.innerHTML='<button data-close>Schließen</button><h2>Lösungen für Lehrkräfte</h2>'+stations.map((s,i)=>'<section class="card"><h3>'+s.object+'</h3>'+questions(i).map(q=>'<p>'+q.prompt+'<br><strong>'+q.explanation+'</strong></p>').join('')+'</section>').join('');openDialog()};
}
function openDialog(){zoom.querySelector('[data-close]').onclick=()=>zoom.close();zoom.showModal()}
function station(i){
 const previous=current;
 const mobileScroll=previous===i?taskbody.scrollTop:0;
 const questionScroll=previous===i?(taskbody.querySelector('.questions')?.scrollTop??0):0;
 current=i;
 tasknav.innerHTML='<div class="tools"><button id="prev" aria-label="Vorherige Station" '+(!i?'disabled':'')+'>‹</button><button id="next" aria-label="Nächste Station" '+(i===3?'disabled':'')+'>›</button></div><strong id="station-title">Station '+(i+1)+' von 4 · '+stations[i].object+'</strong><button id="back">Fertig</button>';
 const qs=questions(i);
 const flags=k=>state[i][k].done?' ✓':'';
 function fields(k){
  const q=qs[k],s=state[i][k];
  const yn=k===1||k===2;
  return (yn?'<div class="statement" role="group" aria-labelledby="prompt-'+k+'"><span id="prompt-'+k+'">':'<fieldset><legend>')+q.prompt+flags(k)+(yn?'</span>':'</legend>')+(q.options?'<div class="choices">'+q.options.map((v,j)=>'<button class="'+(s.done&&s.selected===q.answer&&v===q.answer?'ok':'')+'" data-answer="'+k+':'+j+'" aria-pressed="'+(s.selected===v)+'" '+(s.done?'disabled':'')+'>'+v+'</button>').join('')+'</div>':q.labels.map((l,j)=>'<label>'+l+' <input data-input="'+j+'" inputmode="decimal" value="'+attr(s.values[j])+'" '+(s.done?'disabled':'')+'></label>').join('')+'<div class="tools"><button id="calculator">Rechner</button><button id="check" '+(s.done?'disabled':'')+'>Prüfen</button></div>')+'<p class="status '+(s.done?'good':'')+'" aria-live="polite">'+s.message+'</p>'+(yn?'</div>':'</fieldset>');
 }
 taskbody.innerHTML='<div class="layout"><div class="graphic">'+figure(i)+'<div class="tools reference-links"><button id="expand">Grafik vergrößern</button>'+[2015,2024,2025].map(year=>'<button data-reference="'+year+'" aria-label="Originalgrafik '+year+' öffnen">'+year+'</button>').join('')+'</div></div><div class="questions"><section class="card"><h3>1. Diagrammart erkennen</h3>'+fields(0)+'</section><section class="card"><h3>2. Ja oder Nein</h3><div class="statements">'+fields(1)+fields(2)+'</div></section><section class="card"><h3>3. Eine Antwort auswählen</h3>'+fields(3)+'</section><section class="card"><h3>4. Zahlen eingeben</h3>'+fields(4)+'</section><button id="reset">Antworten dieser Station zurücksetzen</button></div></div>';
 if(!work.open)work.showModal();
 taskbody.scrollTop=mobileScroll;
 taskbody.querySelector('.questions').scrollTop=questionScroll;
 document.querySelector('#prev').onclick=()=>{station(i-1);scrollTo(0,0)};
 document.querySelector('#next').onclick=()=>{station(i+1);scrollTo(0,0)};
 document.querySelector('#back').onclick=()=>{home();scrollTo(0,0)};
 document.querySelector('#expand').onclick=()=>{zoom.innerHTML='<button data-close>Schließen</button>'+figure(i);openDialog()};
 taskbody.querySelectorAll('[data-reference]').forEach(button=>button.onclick=()=>{
  const year=button.dataset.reference;
  zoom.innerHTML='<button data-close>Schließen</button><h2>Konsumfreudige Jugend · '+year+'</h2><img class="reference-image" alt="Konsumfreudige Jugend, Originalgrafik für '+year+'" src="'+referenceImages[year]+'">';
  openDialog();
 });
 taskbody.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const [k,j]=b.dataset.answer.split(':').map(Number);const s=state[i][k];const v=qs[k].options[j];s.selected=v;check(k,v===qs[k].answer);});
 taskbody.querySelectorAll('[data-input]').forEach(b=>b.oninput=()=>state[i][4].values[+b.dataset.input]=b.value);
 function parse(value){return /^\s*[+-]?\d+(?:[.,]\d+)?\s*$/.test(value??'')?Number(value.replace(',','.')):NaN}
 function check(k,correct){
  const s=state[i][k],q=qs[k];
  if(!correct)s.tries++;
  s.done=correct||s.tries>=3;
  s.message=correct?'Richtig. '+q.explanation:s.done?'Lösung: '+q.explanation:'Tipp: '+q.hint;
  station(i);
 }
 document.querySelector('#check').onclick=()=>{
  const values=state[i][4].values;
  if(qs[4].answer.some((_,j)=>!Number.isFinite(parse(values[j])))){state[i][4].message='Trage in alle drei Felder eine Zahl ein.';station(i);return;}
  check(4,qs[4].answer.every((v,j)=>Math.abs(v-parse(values[j]))<.00001));
 };
 document.querySelector('#calculator').onclick=()=>{
  const q=qs[4];
  zoom.innerHTML='<button data-close>Schließen</button><h2>Rechner</h2><p>'+(q.formula==='%'?'Prozentwert ÷ Grundwert × 100':q.formula==='+'?'Erster Betrag + zweiter Betrag':'Späterer Betrag − früherer Betrag')+'</p><label>'+q.labels[0]+' <input id="a" inputmode="decimal"></label><label>'+q.labels[1]+' <input id="b" inputmode="decimal"></label>'+(q.twoPeriods?'<label>'+q.labels[3]+' <input id="reference-2015" inputmode="decimal"></label>':'')+'<button id="calculate">Berechnen</button><output id="result" aria-live="polite"></output>';
  openDialog();
  zoom.querySelector('#calculate').onclick=()=>{
   const a=parse(zoom.querySelector('#a').value),b=parse(zoom.querySelector('#b').value);
   if(q.twoPeriods){
    const earlier=parse(zoom.querySelector('#reference-2015').value);
    zoom.querySelector('#result').textContent=Number.isFinite(a)&&Number.isFinite(b)&&Number.isFinite(earlier)?' 2024–2025: '+num(a-b)+' Mrd. € · 2015–2025: '+num(a-earlier)+' Mrd. €':' Bitte drei gültige Zahlen eingeben.';
    return;
   }
   const result=q.formula==='%'?a/b*100:q.formula==='+'?a+b:a-b;
   zoom.querySelector('#result').textContent=Number.isFinite(result)?' Ergebnis: '+num(result)+(q.formula==='%'?' %':' Mrd. €'):' Bitte zwei gültige Zahlen eingeben.';
  };
 };
 document.querySelector('#reset').onclick=()=>{state[i]=Array.from({length:5},()=>({tries:0,done:false,selected:'',values:[],message:''}));station(i)};
}
home();
</script></html>
